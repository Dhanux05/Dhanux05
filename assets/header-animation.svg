  <!-- Subtle Grid Pattern (kept, lower contrast) -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0f1720" stroke-width="0.5" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.28"/>
  
  <!-- Accent Line Top -->
  <rect x="0" y="0" width="900" height="3" fill="url(#premiumGradient)"/>
  
  <!-- Main Name Text -->
