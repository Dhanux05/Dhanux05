      <stop offset="0%" stop-color="rgba(0,163,255,0)"/>
      <stop offset="40%" stop-color="rgba(0,163,255,0.06)"/>
      <stop offset="60%" stop-color="rgba(123,97,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(0,201,167,0)"/>
    </linearGradient>
  </defs>
  <rect x="-200" y="0" width="1200" height="180" fill="url(#driftGrad)" opacity="0.12">
    <animateTransform attributeName="transform" type="translate" from="-200 0" to="200 0" dur="18s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Full-cover particle layer (dense, subtle motion) -->
