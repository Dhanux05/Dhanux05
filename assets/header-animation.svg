<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180">
  <defs>
    <!-- Premium Animated Gradient (Updated Palette: teal → cyan → violet) -->
    <linearGradient id="premiumGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00A3FF">
        <animate attributeName="stop-color" values="#00A3FF;#7B61FF;#00C9A7;#00A3FF" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#7B61FF">
        <animate attributeName="stop-color" values="#7B61FF;#00C9A7;#00A3FF;#7B61FF" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#00C9A7">
        <animate attributeName="stop-color" values="#00C9A7;#00A3FF;#7B61FF;#00C9A7" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Text Shadow (updated to match new accent) -->
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00A3FF" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background Gradient + Animated Starfield -->
