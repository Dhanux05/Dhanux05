      <circle cx="100" cy="15" r="0.8" fill="#dff"><animate attributeName="opacity" values="0.06;0.85;0.06" dur="4.6s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="55" r="1.0" fill="#aef0e0"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="5.8s" repeatCount="indefinite"/></circle>
      <circle cx="180" cy="30" r="1.2" fill="#c6f3ff"><animate attributeName="opacity" values="0.14;1;0.14" dur="4.4s" repeatCount="indefinite"/></circle>
      <circle cx="220" cy="45" r="0.7" fill="#bff6ff"><animate attributeName="opacity" values="0.07;0.8;0.07" dur="6.2s" repeatCount="indefinite"/></circle>
      <circle cx="260" cy="22" r="1.0" fill="#dff"><animate attributeName="opacity" values="0.09;0.95;0.09" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="50" r="0.85" fill="#aef0e0"><animate attributeName="opacity" values="0.08;0.88;0.08" dur="4.2s" repeatCount="indefinite"/></circle>
      <circle cx="340" cy="18" r="1.15" fill="#c6f3ff"><animate attributeName="opacity" values="0.12;1;0.12" dur="5.6s" repeatCount="indefinite"/></circle>
      <circle cx="380" cy="42" r="0.9" fill="#bff6ff"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.8s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="27" r="0.95" fill="#dff"><animate attributeName="opacity" values="0.11;0.92;0.11" dur="5.4s" repeatCount="indefinite"/></circle>
      <circle cx="460" cy="35" r="1.05" fill="#c6f3ff"><animate attributeName="opacity" values="0.13;1;0.13" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="500" cy="20" r="0.8" fill="#aef0e0"><animate attributeName="opacity" values="0.07;0.75;0.07" dur="4.9s" repeatCount="indefinite"/></circle>
      <circle cx="540" cy="48" r="1.1" fill="#bff6ff"><animate attributeName="opacity" values="0.12;1;0.12" dur="5.1s" repeatCount="indefinite"/></circle>
      <circle cx="580" cy="30" r="0.85" fill="#dff"><animate attributeName="opacity" values="0.09;0.9;0.09" dur="6.4s" repeatCount="indefinite"/></circle>
      <circle cx="620" cy="15" r="1.0" fill="#c6f3ff"><animate attributeName="opacity" values="0.1;0.95;0.1" dur="5.8s" repeatCount="indefinite"/></circle>
